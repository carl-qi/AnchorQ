<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">LIBERO simulation results</title>
  <desc id="desc">Anchor Q outperforms DSRL with FRS prefill at 250 thousand and 500 thousand steps on two LIBERO splits.</desc>
  <rect width="1200" height="700" rx="24" fill="#f8faf9"/>
  <text x="70" y="64" fill="#17373d" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">Held-out LIBERO success rate</text>
  <text x="70" y="96" fill="#657b7f" font-family="Inter, Arial, sans-serif" font-size="18">Mean over four seeds · error bars omitted here for visual clarity</text>

  <g stroke="#d8e2df" stroke-width="1">
    <path d="M105 550 H1135"/><path d="M105 462 H1135"/><path d="M105 374 H1135"/>
    <path d="M105 286 H1135"/><path d="M105 198 H1135"/><path d="M105 110 H1135"/>
  </g>
  <g fill="#718487" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="end">
    <text x="91" y="556">0</text><text x="91" y="468">20</text><text x="91" y="380">40</text>
    <text x="91" y="292">60</text><text x="91" y="204">80</text><text x="91" y="116">100</text>
  </g>

  <line x1="620" y1="126" x2="620" y2="582" stroke="#c8d6d3" stroke-width="2"/>
  <text x="352" y="137" text-anchor="middle" fill="#263f44" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">15-task held-out split</text>
  <text x="873" y="137" text-anchor="middle" fill="#263f44" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800">10-task hard split</text>
  <text x="352" y="165" text-anchor="middle" fill="#718487" font-family="Inter, Arial, sans-serif" font-size="15">zero-shot frozen policy: 9.7%</text>
  <text x="873" y="165" text-anchor="middle" fill="#718487" font-family="Inter, Arial, sans-serif" font-size="15">zero-shot frozen policy: 1.5%</text>

  <g>
    <rect x="184" y="396" width="66" height="154" rx="7" fill="#e0ad45"/>
    <rect x="258" y="206" width="66" height="344" rx="7" fill="#2aa78f"/>
    <text x="217" y="383" text-anchor="middle" fill="#876018" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">35.1</text>
    <text x="291" y="193" text-anchor="middle" fill="#176f61" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">78.2</text>

    <rect x="407" y="323" width="66" height="227" rx="7" fill="#e0ad45"/>
    <rect x="481" y="150" width="66" height="400" rx="7" fill="#2aa78f"/>
    <text x="440" y="310" text-anchor="middle" fill="#876018" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">51.7</text>
    <text x="514" y="137" text-anchor="middle" fill="#176f61" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">90.9</text>

    <rect x="705" y="492" width="66" height="58" rx="7" fill="#e0ad45"/>
    <rect x="779" y="326" width="66" height="224" rx="7" fill="#2aa78f"/>
    <text x="738" y="479" text-anchor="middle" fill="#876018" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">13.2</text>
    <text x="812" y="313" text-anchor="middle" fill="#176f61" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">51.0</text>

    <rect x="928" y="416" width="66" height="134" rx="7" fill="#e0ad45"/>
    <rect x="1002" y="257" width="66" height="293" rx="7" fill="#2aa78f"/>
    <text x="961" y="403" text-anchor="middle" fill="#876018" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">30.5</text>
    <text x="1035" y="244" text-anchor="middle" fill="#176f61" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">66.5</text>
  </g>

  <g fill="#263f44" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <text x="254" y="584">250k steps</text><text x="477" y="584">500k steps</text>
    <text x="775" y="584">250k steps</text><text x="998" y="584">500k steps</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16">
    <rect x="420" y="634" width="18" height="18" rx="4" fill="#e0ad45"/><text x="448" y="649" fill="#526568">DSRL + FRS prefill</text>
    <rect x="629" y="634" width="18" height="18" rx="4" fill="#2aa78f"/><text x="657" y="649" fill="#526568" font-weight="800">Anchor Q</text>
  </g>
</svg>

