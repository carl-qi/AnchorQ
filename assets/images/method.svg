<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690" role="img" aria-labelledby="title desc">
  <title id="title">Anchor Q method</title>
  <desc id="desc">Reference motions are reverse-flowed into state-conditioned anchors, selected by a critic, refined with local particles, and decoded by a frozen flow policy.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf9"/>
      <stop offset="1" stop-color="#eef5f2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5961"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18343a" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1500" height="690" rx="26" fill="#f4f2eb"/>
  <text x="64" y="66" fill="#17373d" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800">A structured action space, rebuilt at every decision</text>
  <text x="64" y="102" fill="#597177" font-family="Inter, Arial, sans-serif" font-size="19">Coarse semantic choice → local value-guided refinement → frozen-policy execution</text>

  <g filter="url(#shadow)">
    <rect x="58" y="154" width="220" height="186" rx="20" fill="url(#panel)" stroke="#b9ceca" stroke-width="2"/>
    <text x="168" y="194" text-anchor="middle" fill="#17373d" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750">Observation</text>
    <rect x="91" y="220" width="154" height="84" rx="12" fill="#dfece8"/>
    <circle cx="132" cy="262" r="19" fill="#5dbda9"/>
    <path d="M166 279 L190 244 L219 280 Z" fill="#f0be52"/>
    <text x="168" y="328" text-anchor="middle" fill="#597177" font-family="Inter, Arial, sans-serif" font-size="17">state s</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="392" width="220" height="206" rx="20" fill="#fffaf0" stroke="#dcc47f" stroke-width="2"/>
    <text x="168" y="432" text-anchor="middle" fill="#4d421e" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750">Reference motions</text>
    <g transform="translate(101 472)" fill="#9f7721" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800">
      <text x="0" y="0">←</text><text x="65" y="0">→</text>
      <text x="2" y="55">↑</text><text x="67" y="55">↓</text>
      <text x="2" y="105" font-size="21">±z</text><text x="70" y="105" font-size="21">defer</text>
    </g>
  </g>

  <path d="M278 247 H342" fill="none" stroke="#2b5961" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M278 495 H315 Q340 495 340 466 V319" fill="none" stroke="#2b5961" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="365" y="195" width="250" height="268" rx="22" fill="#143740" stroke="#2c6b70" stroke-width="2"/>
    <text x="490" y="241" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800">Reverse flow</text>
    <text x="490" y="272" text-anchor="middle" fill="#abd9d1" font-family="Inter, Arial, sans-serif" font-size="16">frozen velocity field</text>
    <path d="M425 357 C440 301 478 300 490 347 C503 394 547 389 558 329" fill="none" stroke="#5ee0c1" stroke-width="5" stroke-linecap="round"/>
    <circle cx="425" cy="357" r="8" fill="#f4c95d"/>
    <circle cx="558" cy="329" r="8" fill="#5ee0c1"/>
    <text x="490" y="430" text-anchor="middle" fill="#dcebea" font-family="Inter, Arial, sans-serif" font-size="17">reference action → latent</text>
  </g>

  <path d="M615 329 H680" fill="none" stroke="#2b5961" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="705" y="154" width="260" height="376" rx="22" fill="url(#panel)" stroke="#9dc5bd" stroke-width="2"/>
    <text x="835" y="197" text-anchor="middle" fill="#17373d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">State-conditioned anchors</text>
    <text x="835" y="227" text-anchor="middle" fill="#597177" font-family="Inter, Arial, sans-serif" font-size="16">Z(s) = {z₁(s), …, z₇(s)}</text>
    <g transform="translate(835 340)">
      <circle r="34" fill="#f4c95d" stroke="#b08326" stroke-width="3"/>
      <g fill="#5dbda9" stroke="#226a60" stroke-width="2">
        <circle cx="-85" cy="0" r="18"/>
        <circle cx="85" cy="0" r="18"/>
        <circle cx="0" cy="-85" r="18"/>
        <circle cx="0" cy="85" r="18"/>
        <circle cx="-60" cy="-60" r="16"/>
        <circle cx="60" cy="60" r="16"/>
      </g>
      <g stroke="#8ea9a4" stroke-width="2">
        <path d="M-66 0 H-35"/><path d="M66 0 H35"/>
        <path d="M0 -66 V-35"/><path d="M0 66 V35"/>
        <path d="M-47 -47 L-25 -25"/><path d="M47 47 L25 25"/>
      </g>
    </g>
    <rect x="744" y="458" width="182" height="45" rx="22" fill="#17373d"/>
    <text x="835" y="487" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">critic selects Q(s,z)</text>
  </g>

  <path d="M965 329 H1024" fill="none" stroke="#2b5961" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1049" y="154" width="244" height="376" rx="22" fill="#fffaf0" stroke="#dcc47f" stroke-width="2"/>
    <text x="1171" y="197" text-anchor="middle" fill="#4d421e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Local refinement</text>
    <text x="1171" y="227" text-anchor="middle" fill="#7c704c" font-family="Inter, Arial, sans-serif" font-size="16">particles around one anchor</text>
    <g transform="translate(1171 334)">
      <circle r="24" fill="#f4c95d" stroke="#a97e22" stroke-width="3"/>
      <g fill="#e5ad39" opacity=".72">
        <circle cx="-57" cy="-28" r="11"/><circle cx="48" cy="-43" r="13"/>
        <circle cx="64" cy="31" r="9"/><circle cx="-38" cy="55" r="14"/>
        <circle cx="-71" cy="25" r="8"/><circle cx="22" cy="66" r="10"/>
        <circle cx="20" cy="-73" r="8"/><circle cx="84" cy="-10" r="7"/>
      </g>
    </g>
    <text x="1171" y="438" text-anchor="middle" fill="#7c704c" font-family="Inter, Arial, sans-serif" font-size="17">wₖ ∝ exp(β Q(s,zₖ))</text>
    <rect x="1081" y="458" width="180" height="45" rx="22" fill="#b98525"/>
    <text x="1171" y="487" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">weighted barycenter</text>
  </g>

  <path d="M1293 329 H1332" fill="none" stroke="#2b5961" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1352" y="195" width="110" height="268" rx="22" fill="#143740" stroke="#2c6b70" stroke-width="2"/>
    <text x="1407" y="247" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Frozen</text>
    <text x="1407" y="273" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">VLA</text>
    <path d="M1382 324 C1390 299 1421 299 1432 324 C1442 348 1419 370 1407 390 C1394 370 1373 348 1382 324 Z" fill="#5ee0c1"/>
    <text x="1407" y="431" text-anchor="middle" fill="#abd9d1" font-family="Inter, Arial, sans-serif" font-size="15">action chunk</text>
  </g>

  <path d="M1407 463 V600 H824 Q800 600 800 574 V541" fill="none" stroke="#8ca7a3" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
  <text x="1070" y="631" text-anchor="middle" fill="#697f82" font-family="Inter, Arial, sans-serif" font-size="17">execute, observe reward, update critic with the same coarse-to-fine backup</text>
</svg>

